<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clasificador Iris</title><link rel="stylesheet" href="/static/style.css"></head><body><main><h1>Clasificador de flores Iris</h1><p>Introduce medidas en centímetros para predecir la especie.</p><form id="form"><label>Largo del sépalo (cm)<input name="sepal_length" type="number" min="0" max="20" step="any" value="5.1" required></label><label>Ancho del sépalo (cm)<input name="sepal_width" type="number" min="0" max="20" step="any" value="3.5" required></label><label>Largo del pétalo (cm)<input name="petal_length" type="number" min="0" max="20" step="any" value="1.4" required></label><label>Ancho del pétalo (cm)<input name="petal_width" type="number" min="0" max="20" step="any" value="0.2" required></label><button>Predecir especie</button></form><section id="result" aria-live="polite"></section><p class="foot">Modelo demostrativo de clasificación; no es una herramienta de identificación botánica certificada.</p></main><script src="/static/app.js"></script></body></html>
